<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>VSCode Open Project — Property Inspector</title>
  <link rel="stylesheet" href="../../static/css/sdpi.css" />
  <style>
    .sdpi-item-label {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .help {
      color: #888;
      font-size: 11px;
      padding: 6px 8px 0 8px;
    }
  </style>
</head>

<body>
  <div class="sdpi-wrapper" style="display: none">

    <div class="sdpi-item">
      <div class="sdpi-item-label">Project path</div>
      <input id="path" class="sdpi-item-value" type="text"
             placeholder="C:\path\to\project" />
    </div>

    <div class="help">
      Absolute folder path that will be opened in VS Code on key press.
      Requires the <code>code</code> CLI on PATH (added by VS Code's
      "Add to PATH" option). Set the key's title in StreamDock's
      standard key panel.
    </div>
  </div>
  <script src="../../static/utils/common.js"></script>
  <script src="../../static/action.js"></script>
  <script src="index.js"></script>
</body>

</html>
